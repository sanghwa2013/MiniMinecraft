<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조트크래프트</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    background: #7ec0ee; 
    font-family: 'Segoe UI', sans-serif; 
    user-select: none; 
  }
  #canvas-container { 
    width: 100vw; 
    height: 100vh; 
  }
  
  #crosshair {
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%);
    width: 16px; 
    height: 16px; 
    pointer-events: none; 
    z-index: 10; 
    display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; 
    position: absolute; 
    background: rgba(255, 255, 255, 0.85); 
    mix-blend-mode: difference;
  }
  #crosshair::before { width: 2px; height: 16px; left: 7px; top: 0; }
  #crosshair::after { width: 16px; height: 2px; top: 7px; left: 0; }

  #water-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 80, 160, 0.45);
    backdrop-filter: blur(1px);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
  }
  #water-overlay.active {
    opacity: 1;
  }

  #hotbar {
    position: fixed; 
    bottom: 16px; 
    left: 50%; 
    transform: translateX(-50%);
    display: flex; 
    gap: 4px; 
    z-index: 10; 
    background: rgba(0,0,0,0.5); 
    padding: 4px; 
    border-radius: 8px;
  }
  .slot {
    width: 48px; 
    height: 58px; 
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.3); 
    border-radius: 6px;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start;
    box-sizing: border-box; 
    cursor: pointer; 
    position: relative; 
    padding-top: 2px;
    transition: transform 0.1s;
  }
  .slot.selected { 
    border-color: #fff; 
    background: rgba(255,255,255,0.2); 
    transform: scale(1.05); 
  }
  .swatch {
    width: 28px; 
    height: 28px; 
    border-radius: 3px; 
    image-rendering: pixelated;
    background-size: cover; 
    margin-top: 4px; 
    border: 1px solid rgba(0,0,0,0.4);
  }
  .slot .num {
    position: absolute; 
    top: 2px; 
    left: 4px; 
    font-size: 10px; 
    color: rgba(255,255,255,0.9); 
    font-weight: bold;
  }
  .slot .slot-name {
    font-size: 8px; 
    color: #fff; 
    margin-top: 2px; 
    text-align: center; 
    white-space: nowrap;
  }

  #hud {
    position: fixed; 
    top: 12px; 
    right: 12px; 
    color: #fff; 
    z-index: 10;
    background: rgba(0,0,0,0.5); 
    padding: 8px 12px; 
    border-radius: 8px;
    font-size: 12px; 
    line-height: 1.5; 
    text-align: right; 
    font-family: 'Consolas', monospace;
  }

  #blocker {
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,0.65);
    display: flex; 
    align-items: center; 
    justify-content: center;
    z-index: 100; 
    color: #fff; 
    text-align: center; 
    cursor: pointer; 
    backdrop-filter: blur(4px);
  }
  #blocker h1 { margin: 0 0 8px 0; font-size: 28px; }
  #blocker .sub { opacity: 0.85; font-size: 14px; margin-bottom: 20px; }
  #blocker .controls {
    background: rgba(255,255,255,0.1); 
    padding: 16px 24px; 
    border-radius: 10px;
    font-size: 13px; 
    line-height: 1.8; 
    text-align: left; 
    display: inline-block;
  }
  #blocker.hidden { display: none; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="crosshair"></div>
<div id="water-overlay"></div>
<div id="hotbar"></div>

<div id="hud">
  <div>FPS: <span id="fps-val">0</span></div>
  <div>XYZ: <span id="x-val">0</span> / <span id="y-val">0</span> / <span id="z-val">0</span></div>
</div>

<div id="blocker">
  <div>
    <h1>조트크래프트</h1>
    <p class="sub">화면을 클릭하여 시작하세요</p>
    <div class="controls">
      <b>🎮 조작법</b><br>
      • WASD: 이동 · Space: 점프 / 수중 헤엄<br>
      • 마우스 이동: 시점 회전<br>
      • 좌클릭: 블록 파괴 (손 스윙)<br>
      • 우클릭: 블록 설치 (손 스윙)<br>
      • 숫자 1~9: 아이템 교체<br>
      • ESC: 일시정지
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('canvas-container');
  const blocker = document.getElementById('blocker');
  const crosshairEl = document.getElementById('crosshair');
  const waterOverlayEl = document.getElementById('water-overlay');
  const fpsEl = document.getElementById('fps-val');
  const xEl = document.getElementById('x-val');
  const yEl = document.getElementById('y-val');
  const zEl = document.getElementById('z-val');

  // ---------- Web Audio API ----------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'break') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.02, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'place') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.02, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'jump') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'splash') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    }
  }

  // ---------- Scene setup ----------
  const scene = new THREE.Scene();
  const skyColor = new THREE.Color(0x7ec0ee);
  const waterFogColor = new THREE.Color(0x1e537d);
  
  scene.background = skyColor.clone();
  scene.fog = new THREE.Fog(skyColor.clone(), 24, 56);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1.0);
  renderer.shadowMap.enabled = false;
  container.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(40, 60, 30);
  scene.add(sun);

  // ---------- Math Helpers & Noise ----------
  function hash2(x, z) {
    const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
    return s - Math.floor(s);
  }

  function perlinLike(x, z) {
    const n1 = Math.sin(x * 0.04) * Math.cos(z * 0.04) * 12;
    const n2 = Math.sin(x * 0.1 + 1.5) * Math.cos(z * 0.1 + 0.8) * 5;
    const n3 = Math.sin(x * 0.2) * Math.sin(z * 0.2) * 2;
    return n1 + n2 + n3;
  }

  // ---------- Textures ----------
  function px(ctx, x, y, colorHex) { ctx.fillStyle = colorHex; ctx.fillRect(x, y, 1, 1); }
  function jitterColor(base, amount, seed) {
    const c = base.clone();
    const hsl = { h: 0, s: 0, l: 0 };
    c.getHSL(hsl);
    const dl = (hash2(seed, seed * 1.7 + 3) - 0.5) * amount;
    return new THREE.Color().setHSL(hsl.h, hsl.s, Math.min(1, Math.max(0, hsl.l + dl)));
  }
  function makeCanvas() { const c = document.createElement('canvas'); c.width = 16; c.height = 16; return c; }
  function toTexture(canvas, wrap = false) {
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    if (wrap) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
    }
    tex.needsUpdate = true;
    return tex;
  }
  function noiseTexture(colorHex, variance) {
    const base = new THREE.Color(colorHex);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++)
      px(ctx, x, y, '#' + jitterColor(base, variance, x * 16 + y).getHexString());
    return toTexture(canvas);
  }
  function grassSideTexture(dirtHex, grassHex) {
    const dirt = new THREE.Color(dirtHex), grass = new THREE.Color(grassHex);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (y < 3 || (y === 3 && hash2(x, y) < 0.4)) px(ctx, x, y, '#' + jitterColor(grass, 0.18, x * 3 + y).getHexString());
      else px(ctx, x, y, '#' + jitterColor(dirt, 0.15, x * 5 + y * 2).getHexString());
    }
    return toTexture(canvas);
  }
  function woodTopTexture(ringHex, baseHex) {
    const ring = new THREE.Color(ringHex), base = new THREE.Color(baseHex);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const d = Math.hypot(x - 7.5, y - 7.5);
      const band = Math.floor(d) % 3 === 0;
      px(ctx, x, y, '#' + jitterColor(band ? ring : base, 0.12, x + y * 7).getHexString());
    }
    return toTexture(canvas);
  }
  function woodSideTexture(barkA, barkB) {
    const a = new THREE.Color(barkA), b = new THREE.Color(barkB);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const stripe = Math.floor(x / 2) % 2 === 0;
      px(ctx, x, y, '#' + jitterColor(stripe ? a : b, 0.1, x * 2 + y).getHexString());
    }
    return toTexture(canvas);
  }
  function brickTexture(brickHex, mortarHex) {
    const brick = new THREE.Color(brickHex), mortar = new THREE.Color(mortarHex);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) {
      const offset = Math.floor(y / 4) % 2 === 0 ? 0 : 4;
      for (let x = 0; x < 16; x++) {
        const isMortar = (y % 4 === 3) || ((x + offset) % 8 === 7);
        const col = isMortar ? mortar : jitterColor(brick, 0.12, x + y * 3);
        px(ctx, x, y, '#' + col.getHexString());
      }
    }
    return toTexture(canvas);
  }
  function glassTexture(colorHex) {
    const base = new THREE.Color(colorHex);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const edge = x === 0 || y === 0 || x === 15 || y === 15;
      ctx.fillStyle = edge ? '#ffffff' : '#' + jitterColor(base, 0.08, x + y).getHexString();
      ctx.globalAlpha = edge ? 0.9 : 0.3;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
    return toTexture(canvas);
  }
  function waterTexture() {
    const base = new THREE.Color(0x2f7cb7);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      px(ctx, x, y, '#' + jitterColor(base, 0.1, x * 9 + y * 7).getHexString());
    }
    return toTexture(canvas, true);
  }
  function bedrockTexture() {
    const base = new THREE.Color(0x333333);
    const canvas = makeCanvas(); const ctx = canvas.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      px(ctx, x, y, '#' + jitterColor(base, 0.35, x * 13 + y * 11).getHexString());
    }
    return toTexture(canvas);
  }

  // ---------- Block Definitions ----------
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const waterPlaneGeo = new THREE.PlaneGeometry(1, 1);
  waterPlaneGeo.rotateX(-Math.PI / 2);

  function matFromTex(tex) { return new THREE.MeshLambertMaterial({ map: tex }); }

  const grassTop = matFromTex(noiseTexture(0x6cbb3c, 0.18));
  const grassSide = matFromTex(grassSideTexture(0x8b5a2b, 0x6cbb3c));
  const grassBottom = matFromTex(noiseTexture(0x8b5a2b, 0.15));
  const dirtMat = matFromTex(noiseTexture(0x8b5a2b, 0.15));
  const stoneMat = matFromTex(noiseTexture(0x8a8a8a, 0.12));
  const woodTop = matFromTex(woodTopTexture(0x6b4423, 0xc9a06b));
  const woodSide = matFromTex(woodSideTexture(0x5c3a1e, 0x4a2e17));
  const leavesMat = matFromTex(noiseTexture(0x2e8b3d, 0.2));
  const sandMat = matFromTex(noiseTexture(0xdccb7d, 0.1));
  const gravelMat = matFromTex(noiseTexture(0x8d8d84, 0.22));
  const brickMat = matFromTex(brickTexture(0xa8442f, 0xcac0af));
  const glassMat = new THREE.MeshLambertMaterial({ map: glassTexture(0xbfe8ff), transparent: true, opacity: 0.6, depthWrite: false });
  const bedrockMat = matFromTex(bedrockTexture());
  
  const waterTex = waterTexture();
  const waterMat = new THREE.MeshLambertMaterial({ 
    map: waterTex, 
    transparent: true, 
    opacity: 0.65,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const grassMatArr = [grassSide, grassSide, grassTop, grassBottom, grassSide, grassSide];
  const woodMatArr = [woodSide, woodSide, woodTop, woodTop, woodSide, woodSide];

  const BLOCK_DEFS = [
    { name: '잔디', material: grassMatArr, color: 0x6cbb3c },
    { name: '흙', material: dirtMat, color: 0x8b5a2b },
    { name: '돌', material: stoneMat, color: 0x8a8a8a },
    { name: '나무', material: woodMatArr, color: 0x6b4423 },
    { name: '나뭇잎', material: leavesMat, color: 0x2e8b3d },
    { name: '모래', material: sandMat, color: 0xdccb7d },
    { name: '자갈', material: gravelMat, color: 0x8d8d84 },
    { name: '벽돌', material: brickMat, color: 0xa8442f },
    { name: '유리', material: glassMat, color: 0xbfe8ff },
    { name: '기반암', material: bedrockMat, color: 0x333333 }
  ];
  const CAPACITY = [40000, 50000, 80000, 20000, 30000, 40000, 20000, 20000, 20000, 40000, 30000];
  const GRASS = 0, DIRT = 1, STONE = 2, WOOD = 3, LEAVES = 4, SAND = 5, GRAVEL = 6, BRICK = 7, GLASS = 8, BEDROCK = 9, WATER = 10;

  // ---------- Instanced Meshes ----------
  const blockLayers = BLOCK_DEFS.map((def, typeIndex) => {
    const mesh = new THREE.InstancedMesh(boxGeo, def.material, CAPACITY[typeIndex]);
    mesh.count = 0;
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(mesh);
    return { mesh, count: 0, capacity: CAPACITY[typeIndex], slotToKey: [] };
  });

  const waterMesh = new THREE.InstancedMesh(waterPlaneGeo, waterMat, CAPACITY[10]);
  waterMesh.count = 0;
  waterMesh.renderOrder = 2; 
  waterMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(waterMesh);
  const waterLayer = { mesh: waterMesh, count: 0, capacity: CAPACITY[10], slotToKey: [] };

  const world = new Map();
  const key = (x, y, z) => x + ',' + y + ',' + z;
  const tmpMat = new THREE.Matrix4();

  function addBlock(x, y, z, typeIndex) {
    const k = key(x, y, z);
    if (world.has(k)) return;
    const layer = typeIndex === WATER ? waterLayer : blockLayers[typeIndex];
    if (layer.count >= layer.capacity) return;
    const idx = layer.count;
    
    if (typeIndex === WATER) {
      tmpMat.makeTranslation(x + 0.5, y + 0.85, z + 0.5);
    } else {
      tmpMat.makeTranslation(x + 0.5, y + 0.5, z + 0.5);
    }

    layer.mesh.setMatrixAt(idx, tmpMat);
    layer.mesh.instanceMatrix.needsUpdate = true;
    layer.slotToKey[idx] = k;
    layer.count++;
    layer.mesh.count = layer.count;
    world.set(k, { typeIndex, instanceIndex: idx });
  }

  function removeBlockAt(x, y, z) {
    const k = key(x, y, z);
    const entry = world.get(k);
    if (!entry) return;
    const layer = entry.typeIndex === WATER ? waterLayer : blockLayers[entry.typeIndex];
    const idx = entry.instanceIndex;
    const last = layer.count - 1;
    if (idx !== last) {
      layer.mesh.getMatrixAt(last, tmpMat);
      layer.mesh.setMatrixAt(idx, tmpMat);
      const movedKey = layer.slotToKey[last];
      layer.slotToKey[idx] = movedKey;
      const movedEntry = world.get(movedKey);
      if (movedEntry) movedEntry.instanceIndex = idx;
    }
    layer.slotToKey[last] = undefined;
    layer.count--;
    layer.mesh.count = layer.count;
    layer.mesh.instanceMatrix.needsUpdate = true;
    world.delete(k);
  }

  // ---------- 파티클 시스템 ----------
  const particles = [];
  const particleGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  const particleMaterials = new Map();

  function getParticleMat(color) {
    if (!particleMaterials.has(color)) {
      particleMaterials.set(color, new THREE.MeshBasicMaterial({ color }));
    }
    return particleMaterials.get(color);
  }

  function spawnBlockParticles(x, y, z, colorHex) {
    const mat = getParticleMat(colorHex);
    for (let i = 0; i < 6; i++) {
      const p = new THREE.Mesh(particleGeo, mat);
      p.position.set(x + 0.5 + (Math.random() - 0.5) * 0.6, y + 0.5 + (Math.random() - 0.5) * 0.6, z + 0.5 + (Math.random() - 0.5) * 0.6);
      const vel = new THREE.Vector3((Math.random() - 0.5) * 4, Math.random() * 3 + 2, (Math.random() - 0.5) * 4);
      scene.add(p);
      particles.push({ mesh: p, vel, life: 0.35 });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        particles.splice(i, 1);
      } else {
        p.vel.y -= 15 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
      }
    }
  }

  // ---------- 손 애니메이션 & Held Block ----------
  const handGroup = new THREE.Group();
  camera.add(handGroup);
  scene.add(camera);

  const skinMat = new THREE.MeshLambertMaterial({ color: 0xe5a885 });
  const handMesh = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.28), skinMat);
  handMesh.position.set(0.4, -0.45, -0.65);
  handMesh.rotation.set(0.2, -0.3, 0.1);
  handGroup.add(handMesh);

  const heldBlockGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
  let heldBlockMesh = new THREE.Mesh(heldBlockGeo, BLOCK_DEFS[0].material);
  heldBlockMesh.position.set(0.32, -0.32, -0.55);
  heldBlockMesh.rotation.set(0.2, -0.5, 0.2);
  handGroup.add(heldBlockMesh);

  function updateHeldBlockMaterial(typeIndex) {
    heldBlockMesh.material = BLOCK_DEFS[typeIndex].material;
    if (typeIndex === GLASS) {
      handMesh.visible = false;
    } else {
      handMesh.visible = true;
    }
  }

  let swingTime = 0;
  let isSwinging = false;

  function triggerSwing() {
    isSwinging = true;
    swingTime = 0;
  }

  function updateHandAnimation(dt, isMoving) {
    const time = performance.now() * 0.008;
    let bobX = 0, bobY = 0;
    if (isMoving && player.onGround) {
      bobX = Math.sin(time) * 0.03;
      bobY = Math.abs(Math.cos(time)) * 0.03;
    }

    let swingProgress = 0;
    if (isSwinging) {
      swingTime += dt * 18;
      if (swingTime >= Math.PI) {
        swingTime = 0;
        isSwinging = false;
      } else {
        swingProgress = Math.sin(swingTime);
      }
    }

    handGroup.position.set(
      bobX, 
      bobY + swingProgress * 0.15, 
      -swingProgress * 0.2
    );
    handGroup.rotation.x = -swingProgress * 1.1; 
    handGroup.rotation.y = swingProgress * 0.3;
  }

  // ---------- Terrain & Biomes & Trees ----------
  const SEA_LEVEL = 0;
  const MIN_Y = -10;

  function heightAt(x, z) {
    const h = perlinLike(x, z);
    return Math.floor(h + 5);
  }

  function plantTree(tx, ty, tz) {
    const treeHeight = 5 + Math.floor(hash2(tx, tz) * 2);
    for (let y = 0; y < treeHeight; y++) {
      addBlock(tx, ty + y, tz, WOOD);
    }
    const leafTop = ty + treeHeight;
    for (let lx = -2; lx <= 2; lx++) {
      for (let lz = -2; lz <= 2; lz++) {
        for (let ly = leafTop - 3; ly <= leafTop + 1; ly++) {
          const dist = Math.hypot(lx, lz, ly - (leafTop - 1));
          if (dist <= 2.4 && !(lx === 0 && lz === 0 && ly < leafTop)) {
            addBlock(tx + lx, ly, tz + lz, LEAVES);
          }
        }
      }
    }
  }

  const CHUNK_SIZE = 16;
  const RENDER_DISTANCE = 3;
  const chunks = new Map();

  function chunkFor(x, z) {
    const cx = Math.floor(x / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    const ck = cx + ',' + cz;
    let c = chunks.get(ck);
    if (!c) { c = { modifications: new Map(), loaded: false }; chunks.set(ck, c); }
    return c;
  }

  function generateChunk(cx, cz) {
    const ck = cx + ',' + cz;
    let chunk = chunks.get(ck);
    if (!chunk) { chunk = { modifications: new Map(), loaded: false }; chunks.set(ck, chunk); }
    if (chunk.loaded) return;
    chunk.loaded = true;

    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const x = cx * CHUNK_SIZE + lx, z = cz * CHUNK_SIZE + lz;
        const h = heightAt(x, z);
        const maxY = Math.max(h, SEA_LEVEL);

        for (let y = MIN_Y; y <= maxY; y++) {
          const k = key(x, y, z);

          if (chunk.modifications.has(k)) {
            const mod = chunk.modifications.get(k);
            if (mod.action === 'add') addBlock(x, y, z, mod.typeIndex);
          } else {
            if (y === MIN_Y) {
              addBlock(x, y, z, BEDROCK);
            } else if (y <= h) {
              if (y === h) {
                if (h <= SEA_LEVEL + 1) addBlock(x, y, z, SAND);
                else addBlock(x, y, z, GRASS);
              } else if (y > h - 3) {
                if (h <= SEA_LEVEL + 1) addBlock(x, y, z, SAND);
                else addBlock(x, y, z, DIRT);
              } else {
                addBlock(x, y, z, STONE);
              }
            } 
          }
        }

        if (h < SEA_LEVEL) {
          addBlock(x, SEA_LEVEL, z, WATER);
        }

        if (h > SEA_LEVEL + 1 && hash2(x * 1.5, z * 2.3) < 0.02) {
          plantTree(x, h + 1, z);
        }
      }
    }
  }

  function unloadChunk(cx, cz) {
    const ck = cx + ',' + cz;
    const chunk = chunks.get(ck);
    if (!chunk || !chunk.loaded) return;

    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const x = cx * CHUNK_SIZE + lx;
        const z = cz * CHUNK_SIZE + lz;
        for (let y = MIN_Y; y <= 35; y++) {
          removeBlockAt(x, y, z);
        }
      }
    }
    chunk.loaded = false;
  }

  function unloadFarChunks(pcx, pcz) {
    for (const [ck, chunk] of chunks.entries()) {
      if (!chunk.loaded) continue;
      const [cx, cz] = ck.split(',').map(Number);
      if (Math.abs(cx - pcx) > RENDER_DISTANCE || Math.abs(cz - pcz) > RENDER_DISTANCE) {
        unloadChunk(cx, cz);
      }
    }
  }

  function ensureChunksAroundPlayer(px, pz) {
    const pcx = Math.floor(px / CHUNK_SIZE), pcz = Math.floor(pz / CHUNK_SIZE);
    unloadFarChunks(pcx, pcz);

    for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
      for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
        const cx = pcx + dx, cz = pcz + dz;
        const ck = cx + ',' + cz;
        if (!chunks.has(ck) || !chunks.get(ck).loaded) generateChunk(cx, cz);
      }
    }
  }

  function getGrassSpawnPos() {
    ensureChunksAroundPlayer(0, 0);

    for (let radius = 0; radius < 80; radius++) {
      for (let x = -radius; x <= radius; x++) {
        for (let z = -radius; z <= radius; z++) {
          const h = heightAt(x, z);
          if (h > SEA_LEVEL + 1) { 
            ensureChunksAroundPlayer(x, z);
            for (let y = h + 5; y >= h - 2; y--) {
              const entry = world.get(key(x, y, z));
              if (entry && entry.typeIndex === GRASS) {
                return new THREE.Vector3(x + 0.5, y + 1.8, z + 0.5);
              }
            }
          }
        }
      }
    }
    return new THREE.Vector3(0.5, 12.8, 0.5);
  }

  const initialSpawnPos = getGrassSpawnPos();

  const player = {
    pos: initialSpawnPos.clone(),
    velocity: new THREE.Vector3(0, 0, 0),
    onGround: false,
    inWater: false,
    height: 1.7,
    radius: 0.3,
    yaw: 0,
    pitch: 0,
  };

  const keys = {};
  let selectedSlot = 0;

  document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Escape') { pauseGame(); return; }
    if (e.key >= '1' && e.key <= '9') selectSlot(parseInt(e.key) - 1);
  });
  document.addEventListener('keyup', (e) => keys[e.code] = false);

  let started = false;

  function resumeGame() {
    initAudio();
    started = true;
    blocker.classList.add('hidden');
    crosshairEl.style.display = 'block';
    renderer.domElement.requestPointerLock();
  }
  function pauseGame() {
    if (!started) return;
    started = false;
    blocker.classList.remove('hidden');
    crosshairEl.style.display = 'none';
    if (document.exitPointerLock) document.exitPointerLock();
  }
  blocker.addEventListener('click', resumeGame);

  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== renderer.domElement && started) pauseGame();
  });

  document.addEventListener('mousemove', (e) => {
    if (!started) return;
    const sensitivity = 0.0022;
    player.yaw -= e.movementX * sensitivity;
    player.pitch -= e.movementY * sensitivity;
    player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
  });

  // ---------- Hotbar UI ----------
  const hotbarEl = document.getElementById('hotbar');
  function iconDataURL(def) {
    const mat = Array.isArray(def.material) ? def.material[2] : def.material;
    return mat.map.image.toDataURL();
  }
  function buildHotbar() {
    hotbarEl.innerHTML = '';
    BLOCK_DEFS.slice(0, 9).forEach((def, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot' + (i === 0 ? ' selected' : '');
      slot.innerHTML = `<span class="num">${i + 1}</span><div class="swatch" style="background-image:url(${iconDataURL(def)})"></div><span class="slot-name">${def.name}</span>`;
      slot.addEventListener('click', () => selectSlot(i));
      hotbarEl.appendChild(slot);
    });
  }
  buildHotbar();

  function selectSlot(i) {
    if (i < 0 || i >= 9) return;
    selectedSlot = i;
    document.querySelectorAll('.slot').forEach((el, idx) => el.classList.toggle('selected', idx === i));
    updateHeldBlockMaterial(i);
  }

  // ---------- Raycast Target ----------
  function isSolidAt(x, y, z) { 
    const entry = world.get(key(x, y, z));
    return entry && entry.typeIndex !== WATER;
  }

function getTargetedBlock() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const origin = camera.position;

  let x = Math.floor(origin.x), y = Math.floor(origin.y), z = Math.floor(origin.z);
  const stepX = dir.x > 0 ? 1 : -1, stepY = dir.y > 0 ? 1 : -1, stepZ = dir.z > 0 ? 1 : -1;
  const deltaX = Math.abs(1 / (dir.x || 1e-8)), deltaY = Math.abs(1 / (dir.y || 1e-8)), deltaZ = Math.abs(1 / (dir.z || 1e-8));

  let maxX = dir.x > 0 ? (x + 1 - origin.x) * deltaX : (origin.x - x) * deltaX;
  let maxY = dir.y > 0 ? (y + 1 - origin.y) * deltaY : (origin.y - y) * deltaY;
  let maxZ = dir.z > 0 ? (z + 1 - origin.z) * deltaZ : (origin.z - z) * deltaZ;

  let normX = 0, normY = 0, normZ = 0;
  let dist = 0;

  while (dist < 7) {
    const k = key(x, y, z);
    const entry = world.get(k);

    // 단단한 블록이거나, 물 블록인 경우 모두 타겟으로 잡음
    if (entry) {
      return { gx: x, gy: y, gz: z, px: x - normX, py: y - normY, pz: z - normZ, typeIndex: entry.typeIndex };
    }

    if (maxX < maxY) {
      if (maxX < maxZ) { dist = maxX; maxX += deltaX; x += stepX; normX = stepX; normY = 0; normZ = 0; }
      else { dist = maxZ; maxZ += deltaZ; z += stepZ; normX = 0; normY = 0; normZ = stepZ; }
    } else {
      if (maxY < maxZ) { dist = maxY; maxY += deltaY; y += stepY; normX = 0; normY = stepY; normZ = 0; }
      else { dist = maxZ; maxZ += deltaZ; z += stepZ; normX = 0; normY = 0; normZ = stepZ; }
    }
  }
  return null;
}

function breakTargetedBlock() {
  triggerSwing();
  const hit = getTargetedBlock();
  if (!hit) return;

  // 물은 파괴 대상이 아님
  if (hit.typeIndex === WATER) return;

  const k = key(hit.gx, hit.gy, hit.gz);
  const entry = world.get(k);
  if (entry) {
    if (entry.typeIndex === BEDROCK) return; // 기반암 보호
    spawnBlockParticles(hit.gx, hit.gy, hit.gz, BLOCK_DEFS[entry.typeIndex].color);
    playSound('break');
  }

  const c = chunkFor(hit.gx, hit.gz);
  
  // 선택한 블록 일단 제거
  removeBlockAt(hit.gx, hit.gy, hit.gz);

  // 해수면(SEA_LEVEL) 이하 위치인 경우 처리
  if (hit.gy <= SEA_LEVEL) {
    const neighbors = [
      key(hit.gx + 1, hit.gy, hit.gz), key(hit.gx - 1, hit.gy, hit.gz),
      key(hit.gx, hit.gy + 1, hit.gz), key(hit.gx, hit.gy - 1, hit.gz),
      key(hit.gx, hit.gy, hit.gz + 1), key(hit.gx, hit.gy, hit.gz - 1)
    ];

    // 주변 6방향에 물이 하나라도 접해있는지 확인
    const isAdjacentToWater = neighbors.some(nk => world.get(nk)?.typeIndex === WATER);

    // 물과 닿아있거나 해수면 높이라면 '즉시' 물로 교체 후 퍼뜨림
    if (isAdjacentToWater || hit.gy === SEA_LEVEL) {
      c.modifications.set(k, { action: 'add', typeIndex: WATER });
      addBlock(hit.gx, hit.gy, hit.gz, WATER);
      
      // 즉시 연쇄 물 확산 실행
      updateWaterFlow();
    } else {
      c.modifications.set(k, { action: 'remove' });
    }
  } else {
    c.modifications.set(k, { action: 'remove' });
  }
}

  renderer.domElement.addEventListener('mousedown', (e) => {
    if (!started) return;
    if (e.button === 0) breakTargetedBlock();
    else if (e.button === 2) placeTargetedBlock();
  });
  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Outline ----------
  const outlineGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.005, 1.005, 1.005));
  const outlineMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
  const outline = new THREE.LineSegments(outlineGeo, outlineMat);
  outline.visible = false;
  scene.add(outline);

  function updateOutline() {
    const hit = getTargetedBlock();
    if (hit) {
      outline.position.set(hit.gx + 0.5, hit.gy + 0.5, hit.gz + 0.5);
      outline.visible = true;
    } else {
      outline.visible = false;
    }
  }

  function placeTargetedBlock() {
  triggerSwing();
  const hit = getTargetedBlock();
  if (!hit) return;

  let nx = hit.px, ny = hit.py, nz = hit.pz;

  // 만약 클릭한 블록 자체가 '물'인 경우, 물이 있는 바로 그 자리에 블록을 덮어써서 설치
  if (hit.typeIndex === WATER) {
    nx = hit.gx;
    ny = hit.gy;
    nz = hit.gz;
  }

  // 플레이어 몸과 겹치는지 체크
  const pMinX = player.pos.x - player.radius, pMaxX = player.pos.x + player.radius;
  const pMinZ = player.pos.z - player.radius, pMaxZ = player.pos.z + player.radius;
  const pMinY = player.pos.y - player.height, pMaxY = player.pos.y;

  if (pMinX < nx + 1 && pMaxX > nx && pMinY < ny + 1 && pMaxY > ny && pMinZ < nz + 1 && pMaxZ > nz) return;

  // 이미 물이 있는 칸이라면 기존 물을 지우고 새 블록 설치
  if (world.has(key(nx, ny, nz))) {
    removeBlockAt(nx, ny, nz);
  }

  const c = chunkFor(nx, nz);
  c.modifications.set(key(nx, ny, nz), { action: 'add', typeIndex: selectedSlot });
  addBlock(nx, ny, nz, selectedSlot);
  playSound('place');
}

  // ---------- Water Flow Algorithm (유체 확산) ----------
  let waterUpdateTimer = 0;
  const WATER_UPDATE_INTERVAL = 0.2; // 0.2초마다 물 확산 처리

  function updateWaterFlow() {
  const waterKeys = [];
  for (const [k, entry] of world.entries()) {
    if (entry.typeIndex === WATER) {
      waterKeys.push(k);
    }
  }

  for (const k of waterKeys) {
    const [x, y, z] = k.split(',').map(Number);

    // 플레이어 주변 30블록 이내만 연산 (성능 최적화)
    if (Math.hypot(x - player.pos.x, z - player.pos.z) > 30) continue;

    const neighbors = [
      { x: x, y: y - 1, z: z }, // 아래쪽 우선
      { x: x + 1, y: y, z: z },
      { x: x - 1, y: y, z: z },
      { x: x, y: y, z: z + 1 },
      { x: x, y: y, z: z - 1 }
    ];

    for (const n of neighbors) {
      if (n.y <= SEA_LEVEL && n.y >= MIN_Y) {
        const neighborKey = key(n.x, n.y, n.z);

        // ★ 핵심: world에 아무런 블록도 없는 '완전한 빈 공간'일 때만 물 설치
        if (!world.has(neighborKey)) {
          const c = chunkFor(n.x, n.z);
          c.modifications.set(neighborKey, { action: 'add', typeIndex: WATER });
          addBlock(n.x, n.y, n.z, WATER);
        }
      }
    }
  }
}

  // ---------- Physics & Movement ----------
  const GRAVITY = -26;
  const JUMP_SPEED = 8.5;
  const MOVE_SPEED = 5.5;
  let stepTimer = 0;
  let wasInWater = false;

  function collidesPlayer(pos) {
    const minX = Math.floor(pos.x - player.radius), maxX = Math.floor(pos.x + player.radius);
    const minZ = Math.floor(pos.z - player.radius), maxZ = Math.floor(pos.z + player.radius);
    const minY = Math.floor(pos.y - player.height), maxY = Math.floor(pos.y - 0.05);
    for (let x = minX; x <= maxX; x++)
      for (let y = minY; y <= maxY; y++)
        for (let z = minZ; z <= maxZ; z++)
          if (isSolidAt(x, y, z)) return true;
    return false;
  }

  function updatePlayer(dt) {
    const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).multiplyScalar(-1);
    const right = new THREE.Vector3(-forward.z, 0, forward.x);

    let moveX = 0, moveZ = 0;
    if (keys['KeyW']) { moveX += forward.x; moveZ += forward.z; }
    if (keys['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
    if (keys['KeyD']) { moveX += right.x; moveZ += right.z; }
    if (keys['KeyA']) { moveX -= right.x; moveZ -= right.z; }
    const len = Math.hypot(moveX, moveZ);
    const isMoving = len > 0;
    if (isMoving) { moveX /= len; moveZ /= len; }

    const eyeY = player.pos.y;
    const playerBlockX = Math.floor(player.pos.x);
    const playerBlockZ = Math.floor(player.pos.z);
    const hAtPos = heightAt(playerBlockX, playerBlockZ);

    const isHeadInWater = (eyeY <= SEA_LEVEL + 0.85) && (hAtPos < SEA_LEVEL);
    player.inWater = isHeadInWater;

    if (player.inWater !== wasInWater) {
      playSound('splash');
      wasInWater = player.inWater;
    }

    if (isHeadInWater) {
      waterOverlayEl.classList.add('active');
      scene.background.lerp(waterFogColor, 0.2);
      scene.fog.color.lerp(waterFogColor, 0.2);
      scene.fog.near = 1;
      scene.fog.far = 18;
    } else {
      waterOverlayEl.classList.remove('active');
      scene.background.copy(skyColor);
      scene.fog.color.copy(skyColor);
      scene.fog.near = 24;
      scene.fog.far = 56;
    }

    // 개선된 수중 점프 및 이동 물리
    if (player.inWater) {
      player.velocity.x = moveX * MOVE_SPEED * 0.85;
      player.velocity.z = moveZ * MOVE_SPEED * 0.85;
      
      if (keys['Space']) {
        // 수면 부근에서 점프 시 더 강한 추진력을 줘서 블록 위로 안착하도록 수정
        if (player.pos.y >= SEA_LEVEL - 0.5) {
          player.velocity.y = 8.5; 
        } else {
          player.velocity.y = 6.5; 
        }
      } else {
        player.velocity.y = -1.0;
      }
    } else {
      player.velocity.x = moveX * MOVE_SPEED;
      player.velocity.z = moveZ * MOVE_SPEED;

      if (keys['Space'] && player.onGround) {
        player.velocity.y = JUMP_SPEED;
        player.onGround = false;
        playSound('jump');
      }
      player.velocity.y += GRAVITY * dt;
    }

    const next = player.pos.clone();
    next.x += player.velocity.x * dt;
    if (collidesPlayer(next)) next.x = player.pos.x;
    next.z += player.velocity.z * dt;
    if (collidesPlayer(next)) next.z = player.pos.z;
    next.y += player.velocity.y * dt;
    if (collidesPlayer(next)) {
      if (player.velocity.y < 0) player.onGround = true;
      player.velocity.y = 0;
      next.y = player.pos.y;
    } else {
      player.onGround = false;
    }
    player.pos.copy(next);

    if (isMoving && player.onGround && !player.inWater) {
      stepTimer += dt;
      if (stepTimer > 0.35) {
        playSound('step');
        stepTimer = 0;
      }
    } else {
      stepTimer = 0;
    }

    if (player.pos.y < MIN_Y - 10) {
      player.pos.copy(initialSpawnPos);
      player.velocity.set(0, 0, 0);
    }

    ensureChunksAroundPlayer(player.pos.x, player.pos.z);
    updateHandAnimation(dt, isMoving);

    camera.position.copy(player.pos);
    const target = player.pos.clone().add(new THREE.Vector3(
      -Math.sin(player.yaw) * Math.cos(player.pitch),
      Math.sin(player.pitch),
      -Math.cos(player.yaw) * Math.cos(player.pitch)
    ));
    camera.lookAt(target);

    sun.position.set(player.pos.x + 40, player.pos.y + 60, player.pos.z + 30);
  }

  // ---------- Loop ----------
  let lastTime = performance.now();
  let frameCount = 0;
  let fpsTimer = 0;

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    waterTex.offset.x += dt * 0.04;
    waterTex.offset.y += dt * 0.02;

    // 물 흐름 업데이트 타이머
    waterUpdateTimer += dt;
    if (waterUpdateTimer >= WATER_UPDATE_INTERVAL) {
      updateWaterFlow();
      waterUpdateTimer = 0;
    }

    frameCount++;
    fpsTimer += dt;
    if (fpsTimer >= 1.0) {
      fpsEl.textContent = frameCount;
      frameCount = 0;
      fpsTimer = 0;
    }

    if (started) {
      updatePlayer(dt);
      updateParticles(dt);
      updateOutline();

      xEl.textContent = Math.floor(player.pos.x);
      yEl.textContent = Math.floor(player.pos.y);
      zEl.textContent = Math.floor(player.pos.z);
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
