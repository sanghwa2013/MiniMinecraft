<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 샌드박스 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px #000; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; }
        .slot { width: 40px; height: 40px; border: 2px solid #aaa; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; }
        .slot.selected { border-color: yellow; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="ui">좌클릭: 블록 파괴 | 우클릭: 블록 설치 | 숫자키 1-3: 슬롯 선택</div>
    <div id="hotbar">
        <div class="slot selected" id="slot-0">1: 흙</div>
        <div class="slot" id="slot-1">2: 잔디</div>
        <div class="slot" id="slot-2">3: 돌</div>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 사운드 시스템 (볼륨 증폭)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'break') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime); // 볼륨 증가
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'place') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime); // 볼륨 증가
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            }
        }

        // 블록 정의 및 맵 설정
        const BLOCK_SIZE = 32;
        const MAP_WIDTH = 100;  // 유한한 맵 크기
        const MAP_HEIGHT = 40;
        const world = {};

        const BLOCKS = {
            AIR: 0,
            DIRT: 1,
            GRASS: 2,
            STONE: 3,
            SAND: 4,
            WATER: 5
        };

        const COLORS = {
            [BLOCKS.DIRT]: '#8B4513',
            [BLOCKS.GRASS]: '#228B22',
            [BLOCKS.STONE]: '#808080',
            [BLOCKS.SAND]: '#E6C280',
            [BLOCKS.WATER]: 'rgba(30, 144, 255, 0.7)'
        };

        // 지형 자연 생성 (유한 맵 + 모래구역 + 물 웅덩이)
        function generateWorld() {
            for (let x = 0; x < MAP_WIDTH; x++) {
                const surfaceY = Math.floor(20 + Math.sin(x * 0.15) * 3);
                for (let y = 0; y < MAP_HEIGHT; y++) {
                    const key = `${x},${y}`;
                    if (y > surfaceY + 5) {
                        world[key] = BLOCKS.STONE;
                    } else if (y > surfaceY) {
                        // 특정 구간은 모래 지형 및 물 웅덩이 생성
                        if (x > 30 && x < 50) {
                            world[key] = (y === surfaceY + 1 && x > 35 && x < 45) ? BLOCKS.WATER : BLOCKS.SAND;
                        } else {
                            world[key] = BLOCKS.DIRT;
                        }
                    } else if (y === surfaceY) {
                        world[key] = (x > 30 && x < 50) ? BLOCKS.SAND : BLOCKS.GRASS;
                    }
                }
            }
        }
        generateWorld();

        // 카메라 및 플레이어 상태
        let cameraX = (MAP_WIDTH * BLOCK_SIZE) / 2 - canvas.width / 2;
        let cameraY = 0;
        let selectedSlot = 0;
        const inventory = [BLOCKS.DIRT, BLOCKS.GRASS, BLOCKS.STONE]; // 물 제외

        // 인벤토리 선택 이벤트
        window.addEventListener('keydown', (e) => {
            if (['1', '2', '3'].includes(e.key)) {
                selectedSlot = parseInt(e.key) - 1;
                document.querySelectorAll('.slot').forEach((el, idx) => {
                    el.classList.toggle('selected', idx === selectedSlot);
                });
            }
        });

        // 클릭 조작 (파괴/설치)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left + cameraX;
            const mouseY = e.clientY - rect.top + cameraY;

            const gridX = Math.floor(mouseX / BLOCK_SIZE);
            const gridY = Math.floor(mouseY / BLOCK_SIZE);

            // 맵 경계 확인
            if (gridX < 0 || gridX >= MAP_WIDTH || gridY < 0 || gridY >= MAP_HEIGHT) return;

            const key = `${gridX},${gridY}`;
            const targetBlock = world[key];

            if (e.button === 0) { // 좌클릭: 파괴
                if (targetBlock && targetBlock !== BLOCKS.WATER) {
                    delete world[key];
                    playSound('break');
                }
            } else if (e.button === 2) { // 우클릭: 설치
                const belowKey = `${gridX},${gridY + 1}`;
                const blockBelow = world[belowKey];

                // 규칙: 모래 위에는 블록 설치 불가
                if (blockBelow === BLOCKS.SAND) {
                    return;
                }

                if (!targetBlock || targetBlock === BLOCKS.WATER) {
                    world[key] = inventory[selectedSlot];
                    playSound('place');
                }
            }
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // 카메라 이동 (방향키/WASD)
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function updateCamera() {
            if (keys['ArrowLeft'] || keys['a']) cameraX -= 8;
            if (keys['ArrowRight'] || keys['d']) cameraX += 8;
            if (keys['ArrowUp'] || keys['w']) cameraY -= 8;
            if (keys['ArrowDown'] || keys['s']) cameraY += 8;

            // 카메라 맵 경계 제한
            cameraX = Math.max(0, Math.min(cameraX, MAP_WIDTH * BLOCK_SIZE - canvas.width));
            cameraY = Math.max(0, Math.min(cameraY, MAP_HEIGHT * BLOCK_SIZE - canvas.height));
        }

        // 최적화된 렌더링 루프 (시야 쿨링)
        function render() {
            updateCamera();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 화면에 보이는 그리드 범위만 계산
            const startX = Math.max(0, Math.floor(cameraX / BLOCK_SIZE));
            const endX = Math.min(MAP_WIDTH, Math.ceil((cameraX + canvas.width) / BLOCK_SIZE));
            const startY = Math.max(0, Math.floor(cameraY / BLOCK_SIZE));
            const endY = Math.min(MAP_HEIGHT, Math.ceil((cameraY + canvas.height) / BLOCK_SIZE));

            for (let x = startX; x < endX; x++) {
                for (let y = startY; y < endY; y++) {
                    const block = world[`${x},${y}`];
                    if (block) {
                        ctx.fillStyle = COLORS[block];
                        ctx.fillRect(
                            x * BLOCK_SIZE - cameraX,
                            y * BLOCK_SIZE - cameraY,
                            BLOCK_SIZE,
                            BLOCK_SIZE
                        );
                        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                        ctx.strokeRect(
                            x * BLOCK_SIZE - cameraX,
                            y * BLOCK_SIZE - cameraY,
                            BLOCK_SIZE,
                            BLOCK_SIZE
                        );
                    }
                }
            }

            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
