<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 마인크래프트</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
    #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }
    
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      text-shadow: 1px 1px 2px black;
      font-size: 14px;
      pointer-events: none;
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
    }
    .slot {
      width: 40px;
      height: 40px;
      margin: 0 4px;
      border: 2px solid #555;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }
    .slot.active {
      border-color: #fff;
      box-shadow: 0 0 8px #fff;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
  <!-- Three.js 3D 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>
  <div id="ui">
    <div>FPS: <span id="fps">0</span></div>
    <div>위치: <span id="pos">0, 0, 0</span></div>
  </div>
  <div id="hotbar">
    <div class="slot active" data-block="1">잔디</div>
    <div class="slot" data-block="2">흙</div>
    <div class="slot" data-block="3">돌</div>
    <div class="slot" data-block="4">모래</div>
    <div class="slot" data-block="5">나무</div>
    <div class="slot" data-block="6">잎</div>
  </div>
  <div id="instructions">
    <h2>클릭하여 시작하기</h2>
    <p>이동: W, A, S, D | 점프: Space</p>
    <p>블록 파괴: 좌클릭 | 블록 설치: 우클릭</p>
    <p>선택: 1~6 숫자키</p>
  </div>

  <script>
    // --- 기본 상수 설정 ---
    const WORLD_SIZE = 48; // 성능 최적화를 위한 월드 크기
    const WORLD_HEIGHT = 32;
    const WATER_LEVEL = 8;
    const BLOCK_SIZE = 1;

    // 블록 타입 정의
    const BLOCKS = {
      AIR: 0,
      GRASS: 1,
      DIRT: 2,
      STONE: 3,
      SAND: 4,
      WOOD: 5,
      LEAVES: 6,
      WATER: 7,
      BEDROCK: 8
    };

    // 블록 색상
    const BLOCK_COLORS = {
      [BLOCKS.GRASS]: 0x557a2b,
      [BLOCKS.DIRT]: 0x866043,
      [BLOCKS.STONE]: 0x7d7d7d,
      [BLOCKS.SAND]: 0xd2b48c,
      [BLOCKS.WOOD]: 0x674d3c,
      [BLOCKS.LEAVES]: 0x2e6f40,
      [BLOCKS.WATER]: 0x2980b9,
      [BLOCKS.BEDROCK]: 0x222222
    };

    // --- 변수 초기화 ---
    let scene, camera, renderer;
    let world = [];
    let meshes = {};
    let selectedBlock = BLOCKS.GRASS;
    let isUnderWater = false;

    // 플레이어 물리학
    let controlsEnabled = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let canJump = false;
    let prevTime = performance.now();

    // 초기화 함수
    function init() {
      // 1. Scene 설정
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // 하늘색
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.025); // 기본 안개 (거리감)

      // 2. Camera 설정
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // 3. Renderer 설정 (성능 옵션 적용)
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // 4. 조명 설정
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(50, 80, 30);
      scene.add(dirLight);

      // 5. 월드 데이터 생성
      generateWorldData();

      // 6. 3D 메쉬 생성 (최적화)
      buildWorldMesh();

      // 7. 플레이어 초기 위치 설정
      camera.position.set(WORLD_SIZE / 2, WORLD_HEIGHT + 2, WORLD_SIZE / 2);

      // 8. 이벤트 리스너
      setupEvents();

      // 9. 루프 시작
      animate();
    }

    // 간단한 퍼린 노이즈 대용 함수 (지형 생성용)
    function pseudoNoise(x, z) {
      return (Math.sin(x * 0.1) + Math.cos(z * 0.1) + Math.sin((x + z) * 0.05)) * 3;
    }

    // 월드 데이터 데이터베이스 생성
    function generateWorldData() {
      // 3D 배열 초기화 [x][y][z]
      for (let x = 0; x < WORLD_SIZE; x++) {
        world[x] = [];
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          world[x][y] = new Uint8Array(WORLD_SIZE);
        }
      }

      // 1. 지형 및 바옴 생성
      for (let x = 0; x < WORLD_SIZE; x++) {
        for (let z = 0; z < WORLD_SIZE; z++) {
          // 바이옴 구분 (모래 바이옴 vs 일반 바이옴)
          const isSandBiome = (Math.sin(x * 0.05) + Math.cos(z * 0.05)) > 0.2;

          let baseHeight = Math.floor(12 + pseudoNoise(x, z));
          baseHeight = Math.max(3, Math.min(WORLD_HEIGHT - 6, baseHeight)); // 높이 제한

          for (let y = 0; y < WORLD_HEIGHT; y++) {
            if (y === 0) {
              // 가장 밑바닥은 공허 방지용 베드락
              world[x][y][z] = BLOCKS.BEDROCK;
            } else if (y < baseHeight - 3) {
              // 밑으로 내려갈수록 돌 블록
              world[x][y][z] = BLOCKS.STONE;
            } else if (y < baseHeight) {
              // 표면 바로 아래 (흙 또는 모래)
              world[x][y][z] = isSandBiome ? BLOCKS.SAND : BLOCKS.DIRT;
            } else if (y === baseHeight) {
              // 표면 블록
              world[x][y][z] = isSandBiome ? BLOCKS.SAND : BLOCKS.GRASS;
            } else if (y <= WATER_LEVEL) {
              // 수면 이하 수채우기 (물 자름 버그 방지)
              world[x][y][z] = BLOCKS.WATER;
            } else {
              world[x][y][z] = BLOCKS.AIR;
            }
          }

          // 2. 나무 생성 (일반 바이옴, 수면 위, 일정 확률)
          if (!isSandBiome && baseHeight > WATER_LEVEL + 1 && Math.random() < 0.015) {
            if (x > 2 && x < WORLD_SIZE - 3 && z > 2 && z < WORLD_SIZE - 3) {
              generateTree(x, baseHeight + 1, z);
            }
          }
        }
      }
    }

    // 나무 구조물 생성 (잎 풍성함 확보 및 버그 예방)
    function generateTree(tx, ty, tz) {
      const height = 4 + Math.floor(Math.random() * 2);
      // 통나무
      for (let i = 0; i < height; i++) {
        if (ty + i < WORLD_HEIGHT) world[tx][ty + i][tz] = BLOCKS.WOOD;
      }
      // 나뭇잎
      const leafStart = ty + height - 2;
      for (let ly = leafStart; ly <= ty + height + 1; ly++) {
        const radius = ly >= ty + height ? 1 : 2;
        for (let lx = tx - radius; lx <= tx + radius; lx++) {
          for (let lz = tz - radius; lz <= tz + radius; lz++) {
            if (lx >= 0 && lx < WORLD_SIZE && ly >= 0 && ly < WORLD_HEIGHT && lz >= 0 && lz < WORLD_SIZE) {
              if (world[lx][ly][lz] === BLOCKS.AIR) {
                // 모서리 약간 잘라내어 자연스럽게
                if (Math.abs(lx - tx) === radius && Math.abs(lz - tz) === radius && Math.random() < 0.4) continue;
                world[lx][ly][lz] = BLOCKS.LEAVES;
              }
            }
          }
        }
      }
    }

    // 인접 블록 체크 (성능 최적화: 가려진 면은 그리지 않음)
    function isBlockOpaque(x, y, z) {
      if (x < 0 || x >= WORLD_SIZE || y < 0 || y >= WORLD_HEIGHT || z < 0 || z >= WORLD_SIZE) return false;
      const b = world[x][y][z];
      return b !== BLOCKS.AIR && b !== BLOCKS.WATER && b !== BLOCKS.LEAVES;
    }

    // 3D 렌더링 메쉬 통합 빌드 (InstancedMesh 사용으로 렉 대폭 감소)
    function buildWorldMesh() {
      // 기존 메쉬 제거
      Object.values(meshes).forEach(m => scene.remove(m));
      meshes = {};

      const countPerType = {};
      Object.values(BLOCKS).forEach(b => countPerType[b] = 0);

      // 인스턴스 개수 계산
      for (let x = 0; x < WORLD_SIZE; x++) {
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          for (let z = 0; z < WORLD_SIZE; z++) {
            const b = world[x][y][z];
            if (b !== BLOCKS.AIR) {
              // 6면이 모두 막혀있는 내부는 렌더링 제외 (성능 대폭 상승)
              if (isBlockOpaque(x+1, y, z) && isBlockOpaque(x-1, y, z) &&
                  isBlockOpaque(x, y+1, z) && isBlockOpaque(x, y-1, z) &&
                  isBlockOpaque(x, y, z+1) && isBlockOpaque(x, y, z-1)) {
                continue;
              }
              countPerType[b]++;
            }
          }
        }
      }

      const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      const matrix = new THREE.Matrix4();

      // 타입별 메쉬 생성
      Object.keys(BLOCK_COLORS).forEach(typeStr => {
        const type = parseInt(typeStr);
        const count = countPerType[type];
        if (count === 0) return;

        let matProps = { color: BLOCK_COLORS[type] };
        if (type === BLOCKS.WATER) {
          matProps.transparent = true;
          matProps.opacity = 0.6;
        } else if (type === BLOCKS.LEAVES) {
          matProps.transparent = true;
          matProps.opacity = 0.9;
        }

        const material = new THREE.MeshLambertMaterial(matProps);
        const instMesh = new THREE.InstancedMesh(geometry, material, count);

        let idx = 0;
        for (let x = 0; x < WORLD_SIZE; x++) {
          for (let y = 0; y < WORLD_HEIGHT; y++) {
            for (let z = 0; z < WORLD_SIZE; z++) {
              if (world[x][y][z] === type) {
                if (isBlockOpaque(x+1, y, z) && isBlockOpaque(x-1, y, z) &&
                    isBlockOpaque(x, y+1, z) && isBlockOpaque(x, y-1, z) &&
                    isBlockOpaque(x, y, z+1) && isBlockOpaque(x, y, z-1)) {
                  continue;
                }
                matrix.setPosition(x, y, z);
                instMesh.setMatrixAt(idx++, matrix);
              }
            }
          }
        }
        instMesh.instanceMatrix.needsUpdate = true;
        scene.add(instMesh);
        meshes[type] = instMesh;
      });
    }

    // --- 키보드 및 마우스 조작 ---
    function setupEvents() {
      const instructions = document.getElementById('instructions');

      instructions.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          controlsEnabled = true;
          instructions.style.display = 'none';
        } else {
          controlsEnabled = false;
          instructions.style.display = 'block';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!controlsEnabled) return;
        const movementX = e.movementX || 0;
        const movementY = e.movementY || 0;

        camera.rotation.y -= movementX * 0.002;
        camera.rotation.x -= movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        camera.rotation.z = 0;
      });

      document.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (canJump) velocity.y += 8; canJump = false; break;
          case 'Digit1': selectSlot(0); break;
          case 'Digit2': selectSlot(1); break;
          case 'Digit3': selectSlot(2); break;
          case 'Digit4': selectSlot(3); break;
          case 'Digit5': selectSlot(4); break;
          case 'Digit6': selectSlot(5); break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });

      document.addEventListener('mousedown', (e) => {
        if (!controlsEnabled) return;
        if (e.button === 0) interactBlock(false); // 좌클릭 파괴
        if (e.button === 2) interactBlock(true);  // 우클릭 설치
      });

      // 우클릭 메뉴 방지
      document.addEventListener('contextmenu', e => e.preventDefault());

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function selectSlot(index) {
      const slots = document.querySelectorAll('.slot');
      slots.forEach((s, i) => {
        if (i === index) {
          s.classList.add('active');
          selectedBlock = parseInt(s.dataset.block);
        } else {
          s.classList.remove('active');
        }
      });
    }

    // 블록 파괴 및 설치 레이캐스팅
    function interactBlock(isBuilding) {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.far = 6; // 도달 거리

      const intersects = raycaster.intersectObjects(Object.values(meshes));

      if (intersects.length > 0) {
        const hit = intersects[0];
        const instanceId = hit.instanceId;
        const mesh = hit.object;

        // hit 위치로부터 블록 좌표 계산
        let pos = hit.point.clone();
        if (isBuilding) {
          pos.add(hit.face.normal.clone().multiplyScalar(0.5));
        } else {
          pos.sub(hit.face.normal.clone().multiplyScalar(0.5));
        }

        const bx = Math.round(pos.x);
        const by = Math.round(pos.y);
        const bz = Math.round(pos.z);

        if (bx >= 0 && bx < WORLD_SIZE && by >= 0 && by < WORLD_HEIGHT && bz >= 0 && bz < WORLD_SIZE) {
          if (isBuilding) {
            if (world[bx][by][bz] === BLOCKS.AIR || world[bx][by][bz] === BLOCKS.WATER) {
              world[bx][by][bz] = selectedBlock;
              buildWorldMesh();
            }
          } else {
            // 베드락은 파괴 불가
            if (world[bx][by][bz] !== BLOCKS.BEDROCK) {
              world[bx][by][bz] = BLOCKS.AIR;
              buildWorldMesh();
            }
          }
        }
      }
    }

    // 간단한 충돌 처리
    function checkCollision(pos) {
      const bx = Math.round(pos.x);
      const by = Math.floor(pos.y - 1.5); // 발 위치
      const bz = Math.round(pos.z);

      if (bx >= 0 && bx < WORLD_SIZE && by >= 0 && by < WORLD_HEIGHT && bz >= 0 && bz < WORLD_SIZE) {
        const b = world[bx][by][bz];
        return b !== BLOCKS.AIR && b !== BLOCKS.WATER;
      }
      return false;
    }

    // 메인 물리 및 애니메이션 루프
    let lastFpsUpdate = 0;
    let frameCount = 0;

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      // FPS 계산
      frameCount++;
      if (time - lastFpsUpdate > 500) {
        document.getElementById('fps').innerText = Math.round((frameCount * 1000) / (time - lastFpsUpdate));
        frameCount = 0;
        lastFpsUpdate = time;
      }

      if (controlsEnabled) {
        // 이동 로직
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 9.8 * 2.5 * delta; // 중력

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 30.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 30.0 * delta;

        // 위치 업데이트
        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y += velocity.y * delta;

        // 충돌 체크 (바닥)
        if (checkCollision(camera.position)) {
          velocity.y = Math.max(0, velocity.y);
          canJump = true;
          camera.position.y = Math.floor(camera.position.y - 1.5) + 1.5 + 0.5;
        }

        // 월드 경계 제한
        camera.position.x = Math.max(1, Math.min(WORLD_SIZE - 2, camera.position.x));
        camera.position.z = Math.max(1, Math.min(WORLD_SIZE - 2, camera.position.z));
        if (camera.position.y < 1) camera.position.y = 1;

        // 좌표 UI 업데이트
        document.getElementById('pos').innerText = 
          `${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;

        // --- 물 속 안개 및 시야 구분 처리 ---
        const cx = Math.round(camera.position.x);
        const cy = Math.floor(camera.position.y);
        const cz = Math.round(camera.position.z);

        const currentlyInWater = (cx >= 0 && cx < WORLD_SIZE && cy >= 0 && cy < WORLD_HEIGHT && cz >= 0 && cz < WORLD_SIZE)
          ? world[cx][cy][cz] === BLOCKS.WATER
          : false;

        if (currentlyInWater !== isUnderWater) {
          isUnderWater = currentlyInWater;
          if (isUnderWater) {
            // 수중 안개 설정 (밝고 또렷한 푸른 시야)
            scene.background.setHex(0x1a5276);
            scene.fog.color.setHex(0x1a5276);
            scene.fog.density = 0.08; // 수중 시야 확보
          } else {
            // 대기 안개 복구
            scene.background.setHex(0x87ceeb);
            scene.fog.color.setHex(0x87ceeb);
            scene.fog.density = 0.025;
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
